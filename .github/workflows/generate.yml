name: Generate episode

on:
  push:
    paths: ["README.md"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; do not commit an episode
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 18 * * *"
    - cron: "47 22 * * *"
    - cron: "17 3 * * *"
    - cron: "47 9 * * *"

permissions:
  contents: write

concurrency:
  group: novel-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate Python
        run: python -m py_compile scripts/*.py
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/generate_episode.py --result-json "$RUNNER_TEMP/result.json"
      - name: Rebuild index
        run: python scripts/rebuild_index.py
      - name: Commit
        run: |
          git config user.name "novel-bot"
          git config user.email "novel-bot@users.noreply.github.com"
          git add docs/episodes docs/episodes.json state/story_state.json
          if git diff --cached --quiet; then exit 0; fi
          episode=$(python -c "import json; print(json.load(open('state/story_state.json'))['next_episode']-1)")
          git commit -m "Publish episode ${episode}"
          git push
