name: Publish episode to Novelpia

on:
  workflow_dispatch:
    inputs:
      episode_path:
        required: true
        type: string
      preview_only:
        required: false
        default: true
        type: boolean
      force_republish:
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      episode_path:
        required: true
        type: string
      preview_only:
        required: false
        default: true
        type: boolean
      force_republish:
        required: false
        default: false
        type: boolean
    secrets:
      NOVELPIA_AUTH_STATE_B64:
        required: true
      GH_SECRET_UPDATE_TOKEN:
        required: false

permissions:
  contents: write

concurrency:
  group: novelpia-publish
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Restore auth state
        env:
          AUTH_STATE_B64: ${{ secrets.NOVELPIA_AUTH_STATE_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value=os.environ.get('AUTH_STATE_B64','')
          if not value: raise SystemExit('NOVELPIA_AUTH_STATE_B64 is missing')
          Path('/tmp/novelpia-auth.json').write_bytes(base64.b64decode(value, validate=True))
          PY
      - name: Upload or preview
        env:
          NOVELPIA_EDITOR_URL: ${{ vars.NOVELPIA_EDITOR_URL }}
          NOVELPIA_PUBLISH_ENABLED: ${{ vars.NOVELPIA_PUBLISH_ENABLED }}
        run: |
          args=(--episode-path "${{ inputs.episode_path }}" --auth-state /tmp/novelpia-auth.json --refreshed-auth /tmp/novelpia-auth-refreshed.json --screenshot preview/novelpia-editor.png)
          if [[ "${{ inputs.preview_only }}" == "true" ]]; then args+=(--preview-only); fi
          if [[ "${{ inputs.force_republish }}" == "true" ]]; then args+=(--force-republish); fi
          python scripts/upload_novelpia.py "${args[@]}"
      - name: Upload preview
        if: ${{ inputs.preview_only == true || vars.NOVELPIA_PUBLISH_ENABLED != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: novelpia-preview
          path: preview/novelpia-editor.png
      - name: Refresh session secret
        if: ${{ success() && vars.NOVELPIA_PUBLISH_ENABLED == 'true' && secrets.GH_SECRET_UPDATE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}
        run: python scripts/refresh_novelpia_secret.py /tmp/novelpia-auth-refreshed.json --repo "${GITHUB_REPOSITORY}"
      - name: Commit publish state
        if: ${{ always() }}
        run: |
          git config user.name "novel-bot"
          git config user.email "novel-bot@users.noreply.github.com"
          git add state/novelpia_publish_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Novelpia publish state"
          git pull --rebase origin main
          git push
