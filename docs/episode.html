<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원고의 바깥</title><style>body{max-width:760px;margin:auto;padding:32px 20px;font-family:system-ui,sans-serif;line-height:1.9}a{color:inherit}</style></head><body><p><a href="./">← 원고의 바깥</a></p><main id="app">불러오는 중...</main><script>const n=new URLSearchParams(location.search).get('episode');const escapeHtml=s=>s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));fetch('episodes.json').then(r=>r.json()).then(xs=>{const x=xs.find(y=>String(y.episode)===String(n));if(!x)throw Error();return fetch(x.path).then(r=>r.text()).then(t=>{const body=t.split(/^---$/m).slice(2).join('---').replace(/^\s*#.*$/m,'').trim();document.title=`${x.episode}화 · ${escapeHtml(x.title)} · 원고의 바깥`;document.querySelector('#app').innerHTML=`<h1>${escapeHtml(String(x.episode))}화 · ${escapeHtml(x.title)}</h1><article>${body.split(/\n\s*\n/).map(p=>`<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('')}</article>`})}).catch(()=>document.querySelector('#app').textContent='회차를 찾을 수 없습니다.');</script></body></html>
