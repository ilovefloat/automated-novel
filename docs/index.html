<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원고의 바깥</title><style>body{max-width:760px;margin:0 auto;padding:32px 20px;font-family:system-ui,sans-serif;line-height:1.9}a{color:inherit}.episode{padding:16px 0;border-bottom:1px solid #ddd}</style></head><body><h1>원고의 바깥</h1><p>독자가 읽는 원고와 이야기 내부의 원고가 같은 텍스트라는 전제에서 시작하는 장편 연재소설.</p><div id="episodes"></div><script>fetch('episodes.json').then(r=>r.json()).then(xs=>{document.querySelector('#episodes').innerHTML=xs.map(x=>`<div class="episode"><a href="episode.html?episode=${x.episode}">${x.episode}화 · ${x.title}</a></div>`).join('')})</script></body></html>
